<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0e14"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="900" height="170" rx="14" fill="url(#quoteBg)"/>
  <rect width="898" height="168" x="1" y="1" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Quotation Mark -->
  <text x="45" y="75" font-family="Georgia, serif" font-size="75" fill="#ef4444" opacity="0.25">“</text>

  <!-- Quote Lines (2 lines for clear readability) -->
  <text x="95" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#f3f4f6" font-style="italic">
    "Any fool can write code that a computer can understand.
  </text>
  <text x="95" y="94" font-family="'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#f3f4f6" font-style="italic">
    Good programmers write code that humans can understand."
  </text>
  <text x="95" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ef4444" letter-spacing="1.2">
    — MARTIN FOWLER
  </text>
</svg>
