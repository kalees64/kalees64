<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#120c14"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b0d11" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
  </g>

  <!-- Window Controls -->
  <g transform="translate(40, 36)">
    <circle cx="0" cy="0" r="6" fill="#ef4444"/>
    <circle cx="20" cy="0" r="6" fill="#f59e0b"/>
    <circle cx="40" cy="0" r="6" fill="#10b981"/>
    <text x="70" y="4" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6b7280" font-weight="600" letter-spacing="1">~/kalees64/profile</text>
  </g>

  <!-- Main Content -->
  <g transform="translate(60, 125)">
    <!-- Badge -->
    <rect x="0" y="0" width="245" height="28" rx="14" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#ef4444"/>
    <text x="28" y="18" font-family="'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#f87171" letter-spacing="1.2">FULL STACK &amp; AI ENGINEER</text>

    <!-- Name -->
    <text x="0" y="75" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-size="46" font-weight="900" fill="#ffffff" letter-spacing="1.5">
      KALEESWARAN <tspan fill="url(#redGlow)">V</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" fill="#9ca3af" font-weight="400" letter-spacing="0.5">
      Next.js • Angular • NestJS • MySQL • Docker • AWS • Claude • Antigravity
    </text>

    <!-- Tech Pills -->
    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="90" height="26" rx="6" fill="#1e1e28" stroke="#ef4444" stroke-width="1"/>
      <text x="45" y="17" font-family="monospace" font-size="12" fill="#f87171" font-weight="700" text-anchor="middle">Next.js</text>

      <rect x="98" y="0" width="90" height="26" rx="6" fill="#1e1e28" stroke="#ef4444" stroke-width="1"/>
      <text x="143" y="17" font-family="monospace" font-size="12" fill="#f87171" font-weight="700" text-anchor="middle">Angular</text>

      <rect x="196" y="0" width="80" height="26" rx="6" fill="#1e1e28" stroke="#374151" stroke-width="1"/>
      <text x="236" y="17" font-family="monospace" font-size="12" fill="#d1d5db" font-weight="600" text-anchor="middle">NestJS</text>

      <rect x="284" y="0" width="75" height="26" rx="6" fill="#1e1e28" stroke="#374151" stroke-width="1"/>
      <text x="321" y="17" font-family="monospace" font-size="12" fill="#d1d5db" font-weight="600" text-anchor="middle">MySQL</text>

      <rect x="367" y="0" width="80" height="26" rx="6" fill="#1e1e28" stroke="#374151" stroke-width="1"/>
      <text x="407" y="17" font-family="monospace" font-size="12" fill="#d1d5db" font-weight="600" text-anchor="middle">Docker</text>

      <rect x="455" y="0" width="65" height="26" rx="6" fill="#1e1e28" stroke="#374151" stroke-width="1"/>
      <text x="487" y="17" font-family="monospace" font-size="12" fill="#d1d5db" font-weight="600" text-anchor="middle">AWS</text>

      <rect x="528" y="0" width="80" height="26" rx="6" fill="#1e1e28" stroke="#374151" stroke-width="1"/>
      <text x="568" y="17" font-family="monospace" font-size="12" fill="#d1d5db" font-weight="600" text-anchor="middle">Flutter</text>

      <rect x="616" y="0" width="80" height="26" rx="6" fill="#1e1e28" stroke="#374151" stroke-width="1"/>
      <text x="656" y="17" font-family="monospace" font-size="12" fill="#d1d5db" font-weight="600" text-anchor="middle">Claude</text>

      <rect x="704" y="0" width="112" height="26" rx="6" fill="#1e1e28" stroke="#ef4444" stroke-width="1"/>
      <text x="760" y="17" font-family="monospace" font-size="12" fill="#f87171" font-weight="600" text-anchor="middle">Antigravity</text>
    </g>
  </g>

  <!-- Right Side Decorative Graphic -->
  <g transform="translate(1010, 160)" opacity="0.8">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#f87171" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="35" fill="#ef4444" fill-opacity="0.1"/>
    <!-- Terminal Code Icon -->
    <path d="M-15 -12 L-3 0 L-15 12 M0 12 L14 12" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
